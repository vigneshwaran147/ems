# ems_backend/src/main/resources/application-h2.yml
app:
  data:
    mode: sql

spring:
  datasource:
    url: jdbc:h2:file:./data/ems_h2_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema-h2.sql
      data-locations: classpath:db/h2/data-h2.sql

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.ems: DEBUG
